name: "Setup Environment"
description: "開発環境のセットアップ（mise で bun/pnpm を導入、pnpm store キャッシュ、install）"
runs:
  using: "composite"
  steps:
    # mise経由でbun/pnpmの適切なバージョンをセットアップ
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
    # pnpm storeのパスを取得
    - name: Get pnpm store directory
      shell: bash
      run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    # pnpm storeのキャッシュで高速化
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    # 依存関係のインストール（lockfile固定）
    - run: pnpm install --frozen-lockfile
      shell: bash
